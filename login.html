<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(135deg,#667eea,#764ba2);
        }

        .container{
            background:white;
            padding:40px;
            width:350px;
            border-radius:15px;
            box-shadow:0 8px 20px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:#333;
        }

        .input-box{
            width:100%;
            margin-bottom:15px;
        }

        .input-box input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            outline:none;
        }

        .input-box input:focus{
            border-color:#667eea;
        }

        .btn{
            width:100%;
            padding:12px;
            border:none;
            background:#667eea;
            color:white;
            font-size:16px;
            border-radius:8px;
            cursor:pointer;
        }

        .btn:hover{
            background:#5563d6;
        }

        .links{
            margin-top:15px;
            text-align:center;
        }

        .links a{
            text-decoration:none;
            color:#667eea;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Login</h2>

        <form>
            <div class="input-box">
                <input type="email" placeholder="Enter Email" required>
            </div>

            <div class="input-box">
                <input type="password" placeholder="Enter Password" required>
            </div>

            <button class="btn">Login</button>

            <div class="links">
                <p><a href="#">Forgot Password?</a></p>
                <br>
                <p>Don't have an account? <a href="#">Sign Up</a></p>
            </div>
        </form>
    </div>

</body>
</html>
